<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e5d5bc">
<title>Rawana — Derrière chaque tombé</title>
<link rel="preload" as="image" href="frames/frame_001.jpg">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body class="loading">
<main id="sequence" aria-label="Premier chapitre : du voile porté à la matière">
  <div class="stage">
    <img class="poster" src="frames/frame_001.jpg" alt="Une femme portant un voile en jersey" width="1600" height="894">
    <canvas id="canvas" aria-label="Du voile porté à la matière"></canvas>
    <header><span class="brand" aria-label="Rawana"><img src="assets/rawana-logo.png" alt="Rawana" width="1536" height="1024"></span><span class="caption">Le Fil continu · 01</span></header>
    <div class="story" aria-label="Derrière chaque tombé">
      <div class="story-moment" id="story-1">
        <div class="story-mask"><p class="story-line">Tout commence par ce que l’on ressent.</p></div>
      </div>
      <div class="story-moment" id="story-2" aria-hidden="true">
        <div class="story-mask"><p class="story-line">Derrière chaque tombé, une matière choisie avec exigence.</p></div>
      </div>
    </div>
    <footer>
      <span id="hint" role="status">Préparation de la matière… <span id="loaded">0</span> / 61</span>
      <span id="counter" aria-hidden="true">001 <span class="separator">/</span> 061</span>
    </footer>
    <div class="track" aria-hidden="true"><div id="progress"></div></div>
    <div id="error" hidden role="alert">Certaines images n’ont pas pu être chargées. <button type="button" onclick="location.reload()">Réessayer</button></div>
    <noscript>Activez JavaScript pour explorer la séquence.</noscript>
  </div>
</main>
</body>
</html>
